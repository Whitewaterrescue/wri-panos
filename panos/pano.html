<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>360 Panorama Viewer</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.css">
<script src="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.js"></script>
<!-- WRI sphere annotations. Source of truth: pano-tiles/annot/pano-annot.js; published here and
     to the other pano repo by deploy_pano_viewer.py, which restamps ?v= with a content hash.
     If this 404s the sphere still works -- it just shows no labels. -->
<script src="pano-annot.js?v=bc5b36eb103c"></script>
<style>
  :root {
    --bg: #0d0f12;
    --accent: #ff6a13;        /* hazard orange — operational context */
    --chip-bg: rgba(13,15,18,0.78);
    --chip-fg: #e8eaed;
    --chip-dim: #9aa0a6;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  /* iOS Safari/Chrome (WebKit) resize the visual viewport LIVE as the address bar hides/shows
     during a scroll/drag gesture -- 100vh/100% on a top-level page tracks that continuously.
     Pannellum's own hotspot positioner and our overlay both read the canvas's CURRENT
     clientWidth/clientHeight and are correct for whatever that is at the instant they run, but the
     canvas's WebGL content only catches up to a NEW size on its own resize handling -- so mid
     gesture, on a real device, the container (and therefore the canvas + overlay, both correctly
     sized for "now") can be a different height than what the canvas has actually re-rendered at,
     for the fraction of a second until it catches up. 100svh ("small viewport height") always
     assumes the address bar is SHOWN and never changes size, which removes the resize entirely
     rather than chasing where in the pipeline it gets picked up. Kept insulated from this class of
     bug entirely: the 360 Annotator editor panel, which is never a top-level page (always an
     iframe) and sizes via flex/100% of its own iframe box, not a viewport unit -- confirmed
     unaffected by Cody 2026-09-27 testing every sphere there with none drifting, only the
     standalone viewer (this file). 100vh first as a fallback for a browser that doesn't know
     100svh; CSS ignores a value it doesn't recognize, so a modern browser applies the second,
     overriding declaration and an old one stays on the first. */
  html, body { width: 100%; height: 100%; height: 100svh; background: var(--bg); overflow: hidden; }
  #panorama { width: 100vw; width: 100svw; height: 100vh; height: 100svh; }

  #chip {
    position: fixed; top: 12px; left: 12px; z-index: 5;
    max-width: min(80vw, 460px);
    background: var(--chip-bg); color: var(--chip-fg);
    border-left: 3px solid var(--accent);
    padding: 8px 12px 8px 11px; border-radius: 2px;
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
    box-shadow: 0 2px 14px rgba(0,0,0,0.45);
    font-family: var(--mono); line-height: 1.35; pointer-events: none;
    opacity: 0; transform: translateY(-4px);
    animation: chipIn 0.45s ease 0.15s forwards;
  }
  @keyframes chipIn { to { opacity: 1; transform: translateY(0); } }
  #chip .title { font-size: 13px; font-weight: 600; letter-spacing: 0.2px; }
  #chip .meta  { font-size: 11px; color: var(--chip-dim); margin-top: 2px; }
  #chip.hidden { display: none; }

  #msg {
    position: fixed; inset: 0; z-index: 10;
    display: none; align-items: center; justify-content: center;
    text-align: center; padding: 24px;
    font-family: var(--mono); color: var(--chip-dim); background: var(--bg);
  }
  #msg.show { display: flex; }
  #labels {
    position: fixed; bottom: 12px; left: 12px; z-index: 6;
    display: none; align-items: center; gap: 6px;
    background: var(--chip-bg); color: var(--chip-fg);
    border: 0; border-left: 3px solid var(--accent);
    padding: 9px 12px; border-radius: 2px; cursor: pointer;
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
    box-shadow: 0 2px 14px rgba(0,0,0,0.45);
    font-family: var(--mono); font-size: 12px; font-weight: 600; letter-spacing: 0.2px;
    min-height: 40px;                       /* thumb-sized: this gets tapped on a phone */
  }
  #labels.show { display: flex; }
  #labels.off { color: var(--chip-dim); border-left-color: var(--chip-dim); }
  #labels .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); }
  #labels.off .dot { background: transparent; box-shadow: inset 0 0 0 1.5px var(--chip-dim); }

  #msg .inner { max-width: 460px; }
  #msg code { color: var(--accent); font-size: 12px; word-break: break-all; }
</style>
</head>
<body>
  <div id="panorama"></div>
  <div id="chip" class="hidden">
    <div class="title" id="chipTitle"></div>
    <div class="meta" id="chipMeta"></div>
  </div>
  <button id="labels" type="button" aria-pressed="true">
    <span class="dot"></span><span id="labelsTxt">Labels</span>
  </button>
  <div id="msg">
    <div class="inner">
      <p>No panorama specified.</p>
      <p style="margin-top:8px">Single image:<br>
        <code>pano.html?img=img/DJI_0001.JPG&amp;title=Site%201</code></p>
      <p style="margin-top:8px">Mobile-safe tiles:<br>
        <code>pano.html?tiles=tiles/0001&amp;title=Site%201</code></p>
    </div>
  </div>

<script>
(function () {
  // Backstop for the class of bug described in the CSS comment above. 100svh is the standards
  // fix for Safari's own toolbar-resize model, but Cody found (2026-09-27, real iPhone, Chrome)
  // that drift persisted even with 100svh live and cache-cleared -- Chrome for iOS is known to
  // not follow the same "assume largest UI" viewport contract Safari's svh/dvh units target, so
  // it can still resize the container out from under the canvas mid-gesture. This backstop does
  // not depend on any browser's interpretation of a CSS viewport unit at all: it measures the
  // visible area itself and PINS the panorama to that fixed pixel size, only re-measuring once
  // resize/visualViewport-resize events stop firing for a bit. A transient mid-gesture resize
  // (the address bar animating) never gets applied -- Pannellum keeps reading the same
  // clientWidth/clientHeight it already had, so its canvas never has a reason to resize mid-drag.
  // Only a genuinely settled resize (rotation, real window resize, done animating) is picked up.
  (function pinViewportSize() {
    var root = document.documentElement;
    var pano = document.getElementById('panorama');
    var pinTimer = null;
    var lastW = window.innerWidth;

    function pin() {
      var vv = window.visualViewport;
      var h = vv ? vv.height : window.innerHeight;
      var w = vv ? vv.width : window.innerWidth;
      root.style.height = h + 'px';
      document.body.style.height = h + 'px';
      pano.style.width = w + 'px';
      pano.style.height = h + 'px';
    }
    pin();

    function onResize() {
      if (window.innerWidth !== lastW) {   // width changed: a real resize/rotation, not the
        lastW = window.innerWidth;         // toolbar -- apply immediately, no debounce
        clearTimeout(pinTimer);
        pin();
        return;
      }
      clearTimeout(pinTimer);              // height-only churn: hold the old (still-correct)
      pinTimer = setTimeout(pin, 400);     // size until events stop firing for a moment
    }
    window.addEventListener('resize', onResize);
    if (window.visualViewport) window.visualViewport.addEventListener('resize', onResize);
  })();

  var qs    = new URLSearchParams(window.location.search);
  var img   = qs.get('img');
  var tiles = qs.get('tiles');

  function num(k, d) { var v = parseFloat(qs.get(k)); return isNaN(v) ? d : v; }

  // Options shared by both modes
  function commonOpts() {
    var o = {
      autoLoad: true,
      showZoomCtrl: true,
      showFullscreenCtrl: true,
      compass: false,                 // no true-north reference in these images
      yaw:   num('heading', 0),       // initial facing; 0 = image center
      pitch: num('pitch', 0),
      hfov:  num('hfov', 100),
      friction: 0.18
    };
    var ar = qs.get('autorotate');
    if (ar !== null && ar !== '' && !isNaN(parseFloat(ar))) o.autoRotate = parseFloat(ar);
    return o;
  }

  function showError(html) {
    var m = document.getElementById('msg');
    m.querySelector('.inner').innerHTML = html;
    m.classList.add('show');
  }

  // --- Annotations -------------------------------------------------------------------------
  // Labels drawn on this sphere by the 360 Annotator, in yaw/pitch. Entirely additive: every
  // failure path here (no pano-annot.js, no table, no token, bad JSON, no row) ends with the
  // sphere rendering exactly as it did before annotations existed.
  //
  // With a WRI-org session in localStorage (the Field App and this page share one Pages origin)
  // we read the org table and see everything. Anonymously -- the public gateway, a shared link,
  // an ICP TV -- we read the public view, which only returns spheres someone explicitly flagged
  // for the gateway.
  function initAnnotations(viewer) {
    var A = window.WRIPanoAnnot;
    if (!A) return;                                  // script blocked or 404: nothing to do
    var key = A.panoKey(window.location.href);
    if (!key) return;

    A.fetchAnnotations(key).then(function (row) {
      if (!row || !row.shapes || !row.shapes.length) return;
      // notes:true lets a tap on a labelled shape open its detail card. A drag still pans:
      // the overlay stays pointer-events:none and taps are detected on the container.
      var overlay = A.Overlay(viewer, {notes: true}).setShapes(row.shapes);
      var btn = document.getElementById('labels');
      var txt = document.getElementById('labelsTxt');
      txt.textContent = 'Labels (' + row.shapes.length + ')';
      btn.classList.add('show');
      btn.addEventListener('click', function () {
        var on = !overlay.isVisible();
        overlay.setVisible(on);
        if (!on) overlay.closeNote();      // hiding labels must hide an open detail card too
        btn.classList.toggle('off', !on);
        btn.setAttribute('aria-pressed', String(on));
      });
    }).catch(function () { /* labels are a bonus, never a reason to fail the sphere */ });
  }

  function start(cfg) {
    var viewer = pannellum.viewer('panorama', cfg);
    viewer.on('error', function (e) {
      showError('<p>Panorama failed to load.</p><p style="margin-top:8px;font-size:11px">' + (e || '') + '</p>');
    });
    // Test handle. The headless checks drive the camera through this; there is nothing here a
    // reader of the page could not already reach through the DOM.
    window.__wriViewer = viewer;
    // The overlay reads the canvas, so wait for the renderer -- but a MULTIRES scene has nothing
    // to preload and Pannellum fires 'load' synchronously inside pannellum.viewer() above, before
    // any handler can be attached. Check the flag first; only fall back to the event.
    function annotate() { try { initAnnotations(viewer); } catch (e) {} }
    if (viewer.isLoaded && viewer.isLoaded()) annotate();
    else viewer.on('load', annotate);

    var title = qs.get('title') || '';
    if (title) {
      var chip = document.getElementById('chip');
      document.getElementById('chipTitle').textContent = title;
      var meta = qs.get('meta');
      if (meta) document.getElementById('chipMeta').textContent = meta;
      else document.getElementById('chipMeta').remove();
      chip.classList.remove('hidden');
    }
  }

  // --- Mode 1: multiresolution tiles (works on every device; preferred for mobile) ---
  if (tiles) {
    var base = tiles.replace(/\/$/, '');
    fetch(base + '/config.json')
      .then(function (r) { if (!r.ok) throw new Error('config.json ' + r.status); return r.json(); })
      .then(function (j) {
        var mr = j.multiRes || {};
        mr.basePath = base;                       // serve tiles relative to this folder
        var cfg = commonOpts();
        cfg.type = 'multires';
        cfg.multiRes = mr;
        start(cfg);
      })
      .catch(function (err) {
        showError('<p>Could not load tile set.</p><p style="margin-top:8px"><code>' +
                  base + '/config.json</code></p><p style="margin-top:8px;font-size:11px">' + err + '</p>');
      });
    return;
  }

  // --- Mode 2: single equirectangular image (simple; desktop-safe) ---
  if (img) {
    var cfg = commonOpts();
    cfg.type = 'equirectangular';
    cfg.panorama = img;                            // absolute URL or path relative to this page
    start(cfg);
    return;
  }

  document.getElementById('msg').classList.add('show');
})();
</script>
</body>
</html>
